<!doctype html><meta charset=utf-8><title>absolute + transform</title><link rel=stylesheet href=common.css>
<style>
.wrap{position:relative;height:300px;background:#fef3c7;transform:translateZ(0)}
.pill{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#111;color:#fff;border-radius:18px;padding:4px}
.pill button{background:#333;color:#fff;border:0;border-radius:14px;padding:6px 14px;font:inherit}
.pill button.on{background:#fff;color:#111}
</style>
<div class=wrap><div class=pill><button class=on>Day</button><button>Week</button><button>Month</button><button>Year</button></div></div>
<main><h1>Absolutely positioned, transformed control group</h1><p>Expect: inset engaged; the page's own transform untouched.</p></main><div class=tall></div>
